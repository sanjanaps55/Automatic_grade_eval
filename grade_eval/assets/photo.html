<!doctype html><html lang=en><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Photo upload</title>
<link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel=stylesheet>
<link rel=stylesheet href="/ui.css">
<style>
body{max-width:560px;margin:0 auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 12px}
.ptop h1{font-size:17px}.ptop a{font-size:13px;font-weight:500;color:var(--mut)}
#msg{margin:12px 0;padding:14px 16px;border-radius:14px;font-size:16px;font-weight:600;text-align:center;background:var(--card);box-shadow:var(--sh);border-left:5px solid var(--ln);line-height:1.4}
#msg.warn{border-left-color:var(--yel)}#msg.busy{border-left-color:var(--ac);color:var(--ac)}#msg.next{border-left-color:#22c55e;background:var(--okb);color:var(--ok)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:8px 0}
.big{display:block;width:100%;padding:22px 10px;font-size:17px;border-radius:16px}
button.alt{background:var(--card);color:var(--ac);border:2px solid var(--ac);box-shadow:none}
button:disabled{opacity:.45}
ul{list-style:none;padding:0;margin:10px 0 0}
li{padding:11px 4px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;gap:10px;font-size:14px;align-items:center}li:last-child{border:0}
li .mut{font-size:13px}
a.dl{display:block;text-align:center;font-weight:600;padding:13px;border-radius:12px;background:var(--ac);color:#fff}
</style>
<div class=ptop><h1>Photo upload &middot; __SLUG__</h1><a href="/s/__SLUG__">Results</a></div>
<div id=msg>Lay one sheet flat in good light, then press <b>Take photo</b>.</div>
<div class=two><button id=snap class=big>Take photo</button><button id=pick class="big alt">Choose from gallery</button></div>
<p class=mut style="text-align:center;margin:0 0 4px">Take as many photos as you need, one after another. The gallery lets you pick several at once.</p>
<input id=cam type=file accept="image/*" capture=environment hidden>
<input id=gal type=file accept="image/*" multiple hidden>
<div class=card style="margin-top:10px"><b id=count style="font-weight:600">0 sheets sent</b><ul id=list></ul>
<div id=done style="display:none;margin-top:12px"><a class=dl href="/s/__SLUG__/marks.xlsx" download>Download Excel</a>
<p class=mut style="margin-top:10px"><a href="/s/__SLUG__">Open the results</a> to review.</p></div></div>
<script>
const base="/s/__SLUG__/photo", $=id=>document.getElementById(id);
let n=0;
function say(t,c){$("msg").textContent=t;$("msg").className=c||"";}
async function follow(job,k,left,right){
  for(let i=0;i<120;i++){
    await new Promise(r=>setTimeout(r,1000));
    try{
      const r=await (await fetch(base+"/job/"+job)).json();
      if(r.state==="reading") continue;
      if(r.state==="error"){right.className="bad";right.textContent="failed";left.textContent=k+". "+r.msg;return;}
      right.className=r.tier==="confirmed"?"ok":r.tier==="check"?"chk":"bad"; right.textContent=r.label;
      left.textContent=""; const b=document.createElement("b"); b.textContent=r.reg||"unknown";
      const nm=document.createElement("span"); nm.className="mut"; nm.textContent=" "+(r.name||""); left.append(k+". ",b,nm);
      return;
    }catch(e){}
  }
  right.className="bad"; right.textContent="no answer";
}
async function send(f){
  let info=" ("+Math.round(f.size/1000)+" KB)";
  try{const b=await createImageBitmap(f);info=" ("+b.width+"×"+b.height+", "+Math.round(f.size/1000)+" KB)";
      if(Math.max(b.width,b.height)<1800||f.size<250000) info+=" ⚠ small or compressed copy: marks may be read less reliably. Use Take photo, not a WhatsApp/gallery copy";
      b.close();}catch(x){}
  const r=await fetch(base+"/capture",{method:"POST",body:f,headers:{"Content-Type":f.type||"image/jpeg"}});
  if(!r.ok) throw new Error("server "+r.status);
  const j=await r.json();
  n++; const k=n, li=document.createElement("li"), left=document.createElement("span"), right=document.createElement("span");
  left.textContent=k+". reading…"+info; right.className="mut"; right.textContent="reading…"; li.append(left,right);
  $("list").prepend(li); $("count").textContent=n+(n===1?" sheet sent":" sheets sent"); $("done").style.display="";
  follow(j.job,k,left,right);
}
async function handle(e){
  const fs=[...e.target.files]; e.target.value=""; if(!fs.length) return;
  $("snap").disabled=$("pick").disabled=true;
  try{
    for(const f of fs){ say("Sending the photo…","busy"); await send(f); }
    say("✓ Sent. Being read in the background. Take the next photo when ready","next"); $("snap").textContent="Take next photo";
  }catch(x){say("Could not send the photo: "+x.message,"warn");}
  $("snap").disabled=$("pick").disabled=false;
}
$("snap").onclick=()=>$("cam").click(); $("pick").onclick=()=>$("gal").click();
$("cam").onchange=handle; $("gal").onchange=handle;
</script></html>
